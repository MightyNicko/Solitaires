<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solitaires">
<meta name="theme-color" content="#10152e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Spider Solitaire</title>
<link rel="stylesheet" href="cards.css">
<link rel="stylesheet" href="game.css">
<script src="i18n.js"></script>
<script src="cards.js"></script>
<script src="sounds.js"></script>
<script src="game.js"></script>
</head>
<body>
<div class="remove-blur" aria-hidden="true"></div>
<div id="board">
  <div class="ring" id="ring"><span id="sets">0/8</span></div>
  <div class="hud"><div class="l"><span><em data-i18n="score">Score</em><b id="score">500</b></span><span><em data-i18n="moves">Moves</em><b id="moves">0</b></span></div><div class="ttl"><span data-i18n="spider">Spider</span></div><div class="r"><span><em data-i18n="time">Time</em><b id="time">0:00</b></span></div></div>
  <div class="dock">
    <button id="b-menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span data-i18n="menu">Menu</span></button>
    <button id="b-undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span data-i18n="undo">Undo</span></button>
    <button id="b-deal" class="deal"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="11" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></svg><span id="deal-lbl">Deal · 5</span></button>
    <button id="b-hint"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg><span data-i18n="hint">Hint</span></button>
    <button id="b-new"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span data-i18n="new">New</span></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="overlay lobby" id="lobby"><div class="panel">
  <div class="medal"><svg viewBox="0 0 48 48" aria-hidden="true"><g fill="#f5d58a"><ellipse cx="24" cy="19" rx="6.5" ry="8"/><circle cx="24" cy="31" r="4.5"/></g><g fill="none" stroke="#f5d58a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20 11 13 8 17M19 24 9 23 6 29M20 29 11 32 9 39M21 33 15 38 14 42"/><path d="M29 20 37 13 40 17M29 24 39 23 42 29M28 29 37 32 39 39M27 33 33 38 34 42"/></g></svg></div>
  <h2 data-i18n="spider">Spider</h2>
  <div class="orn">◆ Solitaire ◆</div>
  <div class="label" data-i18n="difficulty">Difficulty</div>
  <div class="seg" data-key="suits"><button class="btn" data-v="1"></button><button class="btn" data-v="2"></button><button class="btn" data-v="4"></button></div>
  <div class="label" data-i18n="tapMove">Tap a card to move it</div>
  <div class="seg" data-key="tapMove"><button class="btn" data-v="true" data-i18n="on">On</button><button class="btn" data-v="false" data-i18n="off">Off</button></div>
  <div class="statgrid"><div><b id="st-played">0</b><span data-i18n="played">Played</span></div><div><b id="st-won">0</b><span data-i18n="won">Won</span></div><div><b id="st-best">–</b><span data-i18n="bestScore">Best score</span></div></div>
  <button class="btn gold" id="l-resume"></button>
  <button class="btn gold" id="l-play"></button>
  <button class="btn link" id="l-home" data-i18n="allGames">‹ All games</button>
</div></div>

<div class="overlay" id="confirm"><div class="panel">
  <h2 data-i18n="confirmTitle">New game?</h2>
  <p data-i18n="confirmText">The current game will end.</p>
  <div class="row"><button class="btn" id="c-no" data-i18n="cancel">Cancel</button><button class="btn gold" id="c-yes" data-i18n="newGame">New game</button></div>
</div></div>

<div class="overlay" id="win"><div class="panel end">
  <h2 data-i18n="winTitle">Congratulations!</h2>
  <p><span data-i18n="winText">All eight suits are complete.</span><br><span id="win-text"></span></p>
  <div class="row"><button class="btn" id="w-change"></button><button class="btn gold" id="w-new"></button></div>
</div></div>

<script>
(() => {
  const t = I18N.t;
  I18N.apply();
  const $ = id => document.getElementById(id);
  const board = $('board');
  // Gemensamt för alla spel (game.js): lagring, startsidans inställningar, kortens plats, meddelanden och skakning
  const { store, global, SPEED, UNDO, HINTS, FACE, BACK, fmt, btnText, place, instant, toast, shake } = Game.init(board);

  let st = null, hist = [], els = [], slots = [], M = null, drag = null;
  let hints = null, hintIdx = 0, hintTimer = 0, paused = false;

  function loadStats() {
    const s = store.get('spider.stats') || {};
    for (const k of [1, 2, 4]) s[k] = s[k] || { played:0, won:0, best:0, fast:0 };
    return s;
  }
  const saveStats = s => store.set('spider.stats', s);
  const save = () => st && store.set('spider.game', { st, hist });

  // Animationer är en övergripande inställning (startsidan). Svårighetsgrad och tryck-för-att-flytta är Spiders egna.
  const SKEY = 'spider.settings';
  const settings = Object.assign({ suits: global.suits || 2, tapMove: global.tapMove !== false }, store.get(SKEY) || {});
  // Kortens fram- och baksida väljs i startsidans inställningar

  // ---------- Regler ----------
  const D = x => st.deck[x.id];
  const seqOk = (a, b) => a.up && b.up && D(a).s === D(b).s && D(a).r === D(b).r + 1;
  function movable(c, i) {
    const col = st.cols[c];
    if (!col[i] || !col[i].up) return false;
    for (let j = i + 1; j < col.length; j++) if (!seqOk(col[j - 1], col[j])) return false;
    return true;
  }
  function canDrop(id, d) {
    const col = st.cols[d];
    if (!col.length) return true;
    const t = col[col.length - 1];
    return t.up && st.deck[t.id].r === st.deck[id].r + 1;
  }
  function find(id) {
    for (let c = 0; c < 10; c++) { const i = st.cols[c].findIndex(x => x.id === id); if (i >= 0) return { c, i }; }
    return null;
  }
  function flipTop(c) { const col = st.cols[c]; if (col.length) col[col.length - 1].up = true; }
  function checkComplete(c, delay, base) {
    const col = st.cols[c];
    if (col.length < 13) return;
    const i = col.length - 13;
    if (st.deck[col[i].id].r !== 13 || !movable(c, i)) return;
    // Esset (överst) flyger först, kungen sist
    col.splice(i).reverse().forEach((x, k) => { st.done.push(x.id); delay[x.id] = base + k * 45; });
    st.score += 100;
    flipTop(c);
    toast(t('toastSuit'));
  }

  // ---------- Spelflöde ----------
  function newGame(suits) {
    const stats = loadStats(); stats[suits].played++; saveStats(stats);
    settings.suits = suits; store.set(SKEY, settings);
    const list = suits === 1 ? [0] : suits === 2 ? [0, 1] : [0, 1, 2, 3];
    const deck = [];
    for (let k = 0; k < 8; k++) for (let r = 1; r <= 13; r++) deck.push({ s: list[k % list.length], r });
    const ids = deck.map((_, i) => i);
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    const cols = [...Array(10)].map(() => []);
    for (let k = 0; k < 54; k++) cols[k % 10].push({ id: ids.pop(), up: false });
    cols.forEach(col => col[col.length - 1].up = true);
    st = { deck, cols, stock: ids, done: [], score: 500, moves: 0, time: 0, suits, won: false };
    hist = []; clearHint(); buildCards();
    instant(() => els.forEach(e => { place(e, M.sx, M.sy); e.className = 'card stock'; }));
    const delay = {};
    st.cols.forEach((col, c) => col.forEach((x, j) => delay[x.id] = (j * 10 + c) * 22));
    render({ delay }); save();
  }
  function snapshot() { return JSON.stringify({ cols: st.cols, stock: st.stock, done: st.done, score: st.score, moves: st.moves }); }
  function pushHist() { if (!UNDO) return; hist.push(snapshot()); if (hist.length > UNDO) hist.shift(); }
  function after(anim) {
    clearHint(); render(anim); save();
    if (st.done.length === 104 && !st.won) win();
  }
  function doMove(c, i, d) {
    pushHist();
    st.cols[d].push(...st.cols[c].splice(i));
    flipTop(c);
    st.score--; st.moves++;
    after({ vol: MOVE_VOL });
    completeLater([d], 300);
  }
  // En färdig serie tas bort först när draget har landat, så att korten hinner lägga sig i ordning i kolumnen
  let busy = false;
  function completeLater(cols, wait) {
    const game = st;
    if (!cols.some(c => { const col = st.cols[c], i = col.length - 13; return i >= 0 && st.deck[col[i].id].r === 13 && movable(c, i); })) return;
    busy = true;
    setTimeout(() => {
      busy = false;
      if (st !== game) return;
      const delay = {};
      cols.forEach(c => checkComplete(c, delay, 0));
      after({ delay });
    }, wait * SPEED + 60);
  }
  function deal() {
    if (drag || busy || !st.stock.length || st.won) return;
    if (st.cols.some(c => !c.length)) { toast(t('toastNeedCards')); return; }
    pushHist();
    const delay = {};
    for (let c = 0; c < 10; c++) { const id = st.stock.pop(); st.cols[c].push({ id, up: true }); delay[id] = c * 45; }
    st.score--; st.moves++;
    after({ delay });
    completeLater([...Array(10).keys()], 9 * 45 + 300);
  }
  function undo() {
    if (!UNDO) { toast(t('toastUndoOff')); return; }
    if (drag || busy || !hist.length || st.won) return;
    const moves = st.moves;
    Object.assign(st, JSON.parse(hist.pop()));
    st.score--; st.moves = moves + 1;
    after({ vol: MOVE_VOL });
  }
  function win() {
    st.won = true; save(); updateHud();
    const stats = loadStats(), s = stats[st.suits];
    s.won++; if (st.score > s.best) s.best = st.score;
    if (!s.fast || st.time < s.fast) s.fast = st.time;   // snabbaste vinst i sekunder
    saveStats(stats);
    setTimeout(() => { $('win-text').textContent = t('winStats', { score: st.score, moves: st.moves, time: fmt(st.time) }); open('win'); }, 1200);
  }
  function bestDest(c, i) {
    const id = st.cols[c][i].id, card = st.deck[id];
    let best = -1, bs = 0;
    for (let d = 0; d < 10; d++) {
      if (d === c || !canDrop(id, d)) continue;
      const col = st.cols[d];
      let s;
      if (!col.length) { if (i === 0) continue; s = 1; }
      else s = st.deck[col[col.length - 1].id].s === card.s ? 3 : 2;
      if (s > bs) { bs = s; best = d; }
    }
    return best;
  }

  // ---------- Tips ----------
  function findMoves() {
    const res = [], seen = new Set();
    st.cols.forEach((col, s) => {
      if (!col.length) return;
      let i = col.length - 1;
      while (i > 0 && seqOk(col[i - 1], col[i])) i--;
      for (let k = i; k < col.length; k++) {
        const card = D(col[k]), below = col[k - 1];
        for (let d = 0; d < 10; d++) {
          if (d === s) continue;
          const dest = st.cols[d], top = dest.length ? D(dest[dest.length - 1]) : null;
          const same = top && top.s === card.s;
          let sc;
          if (!top) { if (k === 0 || seen.has(s + ',' + k)) continue; seen.add(s + ',' + k); sc = 1; }
          else { if (top.r !== card.r + 1) continue; sc = same ? 4 : 2; }
          if (below && below.up) { const b = D(below); if (b.r === card.r + 1 && (b.s === card.s || !same)) continue; }
          if (below && !below.up) sc += 2;
          if (k === 0) sc += 1;
          res.push({ s, k, d, sc });
        }
      }
    });
    return res.sort((a, b) => b.sc - a.sc);
  }
  function hint() {
    if (!HINTS) { toast(t('toastHintsOff')); return; }
    if (busy || st.won) return;
    if (!hints) { hints = findMoves(); hintIdx = 0; }
    clearHintMarks();
    if (!hints.length) {
      if (st.stock.length) { const b = $('b-deal'); b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); toast(t('toastNoMovesDeal')); }
      else toast(t('toastNoMoves'));
      return;
    }
    const h = hints[hintIdx++ % hints.length];
    st.cols[h.s].slice(h.k).forEach(x => els[x.id].classList.add('hint'));
    targetEl(h.d).classList.add('hint');
    hintTimer = setTimeout(clearHintMarks, 1600);
  }
  function clearHintMarks() { clearTimeout(hintTimer); board.querySelectorAll('.hint').forEach(e => e.classList.remove('hint')); }
  function clearHint() { hints = null; clearHintMarks(); }

  // ---------- Rendering ----------
  const MOVE_VOL = .4;   // spelarens egna flyttar (och ångra) låter svagare än utdelningen
  function buildCards() {
    els.forEach(e => e.remove());
    els = st.deck.map((c, id) => {
      const e = document.createElement('div');
      e.className = 'card'; e.dataset.id = id;
      e.innerHTML = CardFaces.html(c, FACE);
      board.appendChild(e);
      return e;
    });
  }
  function layout() {
    const W = board.clientWidth, H = board.clientHeight;
    const padX = Math.max(6, W * .012), colW = (W - 2 * padX) / 10;
    // Korten får ytan mellan HUD:en och dockan (som redan tar hänsyn till statusfält och hemindikator)
    const br = board.getBoundingClientRect(), db = $('b-deal').getBoundingClientRect(), rr = $('ring').getBoundingClientRect();
    const top = Math.max(rr.bottom, document.querySelector('.hud').getBoundingClientRect().bottom) - br.top + 12;
    const bottom = document.querySelector('.dock').getBoundingClientRect().top - br.top - 8;
    let cw = Math.min(colW * .88, 124);
    cw = Math.min(cw, (bottom - top) * .32 / 1.4);
    const ch = cw * 1.4;
    board.style.setProperty('--cw', cw + 'px');
    board.style.setProperty('--ch', ch + 'px');
    const colX = [...Array(10)].map((_, c) => padX + c * colW + (colW - cw) / 2);
    M = { W, H, padX, colW, cw, ch, colX, top, bottom,
          sx: db.left - br.left + db.width / 2 - cw / 2, sy: db.top - br.top + db.height / 2 - ch / 2,
          rx: rr.left - br.left + rr.width / 2 - cw / 2, ry: rr.top - br.top + rr.height / 2 - ch / 2 };
    slots.forEach((s, c) => { s.style.left = colX[c] + 'px'; s.style.top = top + 'px'; });
  }
  function colOffsets(col) {
    const down = M.ch * .11, up = M.ch * .3, offs = [];
    let sum = 0;
    for (let k = 0; k < col.length - 1; k++) { const o = col[k].up ? up : down; offs.push(o); sum += o; }
    const room = M.bottom - M.top - M.ch, f = sum > room ? room / sum : 1;
    const ys = [0];
    offs.forEach((o, k) => ys.push(ys[k] + o * f));
    return ys;
  }
  function render(anim = {}) {
    const delay = anim.delay || {};
    const quiet = board.classList.contains('noanim');
    const set = (id, x, y, z, cls) => {
      const e = els[id];
      // Ett kort som flyttas låter när det landar: efter sin fördröjning och ca 60 % av rörelsen (den bromsar in mot slutet)
      if (!quiet && (Math.abs(e._x - x) > 8 || Math.abs(e._y - y) > 8))
        CardSounds.place(((delay[id] || 0) + 180) * SPEED, (cls.includes('gone') ? .6 : 1) * (anim.vol ?? 1));
      // Skriv bara det som har ändrats, så att webbläsaren inte behöver räkna om kort som ligger still
      const zs = String(z), dl = (delay[id] || 0) * SPEED + 'ms';
      if (e._x !== x || e._y !== y) place(e, x, y);
      if (e.style.zIndex !== zs) e.style.zIndex = zs;
      if (e.className !== cls) e.className = cls;
      if (e.style.transitionDelay !== dl) e.style.transitionDelay = dl;
    };
    st.stock.forEach(id => set(id, M.sx, M.sy, 1, 'card stock'));
    st.done.forEach((id, j) => set(id, M.rx, M.ry, 3100 - j % 13, 'card up gone'));
    st.cols.forEach((col, c) => {
      const ys = colOffsets(col);
      col.forEach((x, k) => set(x.id, M.colX[c], M.top + ys[k], k + 1, 'card' + (x.up ? ' up' : '')));
    });
    updateHud();
  }
  function updateHud() {
    $('score').textContent = st.score;
    $('moves').textContent = st.moves;
    $('time').textContent = fmt(st.time);
    const sets = st.done.length / 13;
    $('sets').textContent = sets + '/8';
    $('ring').style.setProperty('--p', sets / 8 * 100);
    $('deal-lbl').textContent = t('deal', st.stock.length / 10);
    $('b-deal').disabled = !st.stock.length || st.won;
    $('b-undo').disabled = UNDO > 0 && (!hist.length || st.won);
  }

  // ---------- Touch / mus ----------
  const targetEl = d => { const col = st.cols[d]; return col.length ? els[col[col.length - 1].id] : slots[d]; };
  const clearTarget = () => board.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  const colAt = x => Math.max(0, Math.min(9, Math.floor((x - M.padX) / M.colW)));

  board.addEventListener('pointerdown', e => {
    if (drag || busy || !st || st.won) return;
    if (relayout()) return;   // skärmen har vridits utan att vi märkt det: rätta layouten först
    const el = e.target.closest('.card');
    if (!el) return;
    const id = +el.dataset.id, loc = find(id);
    if (!loc || !st.cols[loc.c][loc.i].up) return;
    e.preventDefault();
    clearHintMarks();
    drag = { ...loc, id, pid: e.pointerId, x0: e.clientX, y0: e.clientY, moving: false, ok: movable(loc.c, loc.i),
             run: st.cols[loc.c].slice(loc.i).map(x => els[x.id]), target: -1 };
  });
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moving) {
      if (Math.hypot(dx, dy) < 8 || !drag.ok) return;
      drag.moving = true;
      drag.run.forEach((el, k) => { el.classList.add('dragging'); el.style.zIndex = 4000 + k; });
    }
    drag.dx = dx; drag.dy = dy;
    drag.run.forEach(el => el.style.translate = `${el._x + dx}px ${el._y + dy}px`);
    const d = colAt(M.colX[drag.c] + M.cw / 2 + dx);
    const t = d !== drag.c && canDrop(drag.id, d) ? d : -1;
    if (t !== drag.target) { clearTarget(); drag.target = t; if (t >= 0) targetEl(t).classList.add('target'); }
  });
  function endDrag(e, cancel) {
    if (!drag || e.pointerId !== drag.pid) return;
    const g = drag; drag = null; clearTarget();
    if (g.moving) {
      // Flytta in fingrets förskjutning i kortets plats innan animationen, så att den startar där korten släpptes.
      g.run.forEach(el => {
        place(el, el._x + g.dx, el._y + g.dy);
      });
      void board.offsetWidth;
      if (!cancel && g.target >= 0) doMove(g.c, g.i, g.target); else render({ vol: MOVE_VOL });
    } else if (!cancel && settings.tapMove) {
      const d = g.ok ? bestDest(g.c, g.i) : -1;
      if (d >= 0) doMove(g.c, g.i, d); else shake(g.run);
    }
    setTimeout(relayout, 400);   // om skärmen vreds under draget
  }
  window.addEventListener('pointerup', e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  // ---------- Knappar & dialoger ----------
  function close(id) { $(id).classList.remove('open'); paused = !!document.querySelector('.overlay.open'); }
  const colors = n => t('suits', n);
  // Slutdialogernas knappar: rubrik plus en rad om vad som händer, och Nytt spel visar inställningarna det startas med
  function fillEnd() {
    const next = btnText(t('newGame'), colors(settings.suits)), change = btnText(t('changeGame'), t('spiderChangeSub'));
    $('w-change').innerHTML = change;
    $('w-new').innerHTML = next;
  }
  function open(id) { if (id === 'win') fillEnd(); paused = true; $(id).classList.add('open'); }
  document.querySelectorAll('#lobby [data-key=suits] .btn').forEach(b => b.textContent = colors(+b.dataset.v));
  const inProgress = () => st && !st.won && st.moves > 0;
  function refreshLobby() {
    document.querySelectorAll('#lobby .seg').forEach(seg => {
      const v = String(settings[seg.dataset.key]);
      seg.querySelectorAll('.btn').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    });
    const s = loadStats()[settings.suits];
    $('st-played').textContent = s.played; $('st-won').textContent = s.won; $('st-best').textContent = s.best || '–';
    const going = inProgress();
    $('l-resume').style.display = going ? '' : 'none';
    if (going) $('l-resume').innerHTML = `${t('resume')}<small>${colors(st.suits)} · ${t('progress', st.done.length / 13)}</small>`;
    $('l-play').className = going ? 'btn' : 'btn gold';
    $('l-play').innerHTML = `${going ? t('newGame') : t('play')}<small>${colors(settings.suits)}</small>`;
  }
  function showLobby() { refreshLobby(); open('lobby'); }
  document.querySelectorAll('#lobby .seg').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('.btn');
    if (!b) return;
    const key = seg.dataset.key;
    settings[key] = key === 'tapMove' ? b.dataset.v === 'true' : +b.dataset.v;
    store.set(SKEY, settings);
    refreshLobby();
  }));
  $('b-deal').onclick = deal;
  $('b-undo').onclick = undo;
  $('b-hint').onclick = hint;
  $('b-menu').onclick = showLobby;
  $('b-new').onclick = () => { if (inProgress()) open('confirm'); else newGame(settings.suits); };
  $('l-resume').onclick = () => close('lobby');
  $('l-play').onclick = () => { if (inProgress()) open('confirm'); else { close('lobby'); newGame(settings.suits); } };
  $('l-home').onclick = () => { save(); location.href = 'games.html'; };
  $('c-no').onclick = () => close('confirm');
  $('c-yes').onclick = () => { close('confirm'); close('lobby'); newGame(settings.suits); };
  $('w-new').onclick = () => { close('win'); newGame(settings.suits); };
  $('w-change').onclick = () => { close('win'); showLobby(); };
  document.addEventListener('keydown', e => {
    if (paused) return;
    if (e.key === 'z' || e.key === 'Z') undo();
    else if (e.key === 'd' || e.key === ' ') { e.preventDefault(); deal(); }
    else if (e.key === 'h') hint();
  });

  // Räkna om layouten när skärmen ändrar storlek (game.js lyssnar efter vridning och storleksändring)
  function relayout() {
    if (drag || !M || (M.W === board.clientWidth && M.H === board.clientHeight)) return false;
    layout(); if (st) instant(() => render());
    return true;
  }
  // Tidtagning, sparande när appen stängs, omräkning vid vridning och offline-stöd (game.js)
  Game.watch({ board, game: () => st, paused: () => paused, save, relayout });

  // ---------- Start ----------
  for (let c = 0; c < 10; c++) { const s = document.createElement('div'); s.className = 'slot'; board.appendChild(s); slots.push(s); }
  layout();
  const saved = store.get('spider.game');
  if (saved && saved.st && saved.st.deck && saved.st.deck.length === 104 && !saved.st.won && saved.st.moves > 0) {
    st = saved.st; hist = UNDO ? (saved.hist || []).slice(-UNDO) : [];
    for (let c = 0; c < 10; c++) checkComplete(c, {}, 0);
    buildCards();
    instant(() => render());
  }
  showLobby();
})();
</script>
</body>
</html>
