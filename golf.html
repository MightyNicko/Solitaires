<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solitaires">
<meta name="theme-color" content="#10152e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Golf Solitaire</title>
<link rel="stylesheet" href="cards.css">
<link rel="stylesheet" href="game.css">
<script src="i18n.js"></script>
<script src="cards.js"></script>
<script src="sounds.js"></script>
<script src="game.js"></script>
</head>
<body>
<div class="remove-blur" aria-hidden="true"></div>
<div id="board">
  <div class="ring" id="ring"><span id="cleared">0/35</span></div>
  <div class="hud"><div class="l"><span><em data-i18n="score">Score</em><b id="score">0</b></span><span><em data-i18n="moves">Moves</em><b id="moves">0</b></span></div><div class="ttl"><span>Golf</span></div><div class="r"><span><em data-i18n="time">Time</em><b id="time">0:00</b></span><span><em data-i18n="left">Left</em><b id="left">0</b></span></div></div>
  <div class="slot stock" id="stock-slot"></div>
  <div class="slot" id="waste-slot"></div>
  <div class="badge" id="stock-n"></div>
  <div class="plabel" id="stock-lbl" data-i18n="stock">Draw pile</div>
  <div class="plabel" id="waste-lbl" data-i18n="waste">Discard pile</div>
  <div class="dock">
    <button id="b-menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span data-i18n="menu">Menu</span></button>
    <button id="b-undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span data-i18n="undo">Undo</span></button>
    <button id="b-draw" class="deal"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="11" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></svg><span id="draw-lbl">Draw</span></button>
    <button id="b-hint"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg><span data-i18n="hint">Hint</span></button>
    <button id="b-new"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span data-i18n="new">New</span></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="overlay lobby" id="lobby"><div class="panel">
  <div class="medal"><svg viewBox="0 0 48 48" aria-hidden="true"><line x1="21" y1="7" x2="21" y2="38" stroke="#f5d58a" stroke-width="2.4" stroke-linecap="round"/><path fill="#f5d58a" d="M22 7l14 5.5L22 18z"/><ellipse cx="24" cy="39.5" rx="11" ry="3" fill="none" stroke="#f5d58a" stroke-width="2"/></svg></div>
  <h2>Golf</h2>
  <div class="orn">◆ Solitaire ◆</div>
  <p class="rules" id="rules"></p>
  <div class="label" data-i18n="variant">Variant</div>
  <div class="seg" data-key="variant"><button class="btn" data-v="classic" data-i18n="classic">Classic</button><button class="btn" data-v="wrap" data-i18n="wrap">Round the corner</button></div>
  <div class="statgrid"><div><b id="st-played">0</b><span data-i18n="played">Played</span></div><div><b id="st-won">0</b><span data-i18n="won">Won</span></div><div><b id="st-best">–</b><span data-i18n="bestScore">Best score</span></div></div>
  <button class="btn gold" id="l-resume"></button>
  <button class="btn gold" id="l-play"></button>
  <button class="btn link" id="l-home" data-i18n="allGames">‹ All games</button>
</div></div>

<div class="overlay" id="confirm"><div class="panel">
  <h2 data-i18n="confirmTitle">New game?</h2>
  <p data-i18n="confirmText">The current game will end.</p>
  <div class="row"><button class="btn" id="c-no" data-i18n="cancel">Cancel</button><button class="btn gold" id="c-yes" data-i18n="newGame">New game</button></div>
</div></div>

<div class="overlay" id="win"><div class="panel end">
  <h2 data-i18n="winTitle">Congratulations!</h2>
  <p><span data-i18n="golfWin">All columns are cleared!</span><br><span id="win-text"></span></p>
  <div class="row"><button class="btn" id="w-change"></button><button class="btn gold" id="w-new"></button></div>
</div></div>

<div class="overlay" id="lost"><div class="panel end">
  <h2 data-i18n="lostTitle">No more moves</h2>
  <p><span data-i18n="golfLost">No card fits and the draw pile is empty.</span><br><span id="lost-text"></span></p>
  <div class="row"><button class="btn" id="lo-undo"></button><button class="btn" id="lo-change"></button><button class="btn gold" id="lo-new"></button></div>
</div></div>

<script>
(() => {
  const t = I18N.t;
  I18N.apply();
  const $ = id => document.getElementById(id);
  const board = $('board');
  // Gemensamt för alla spel (game.js): lagring, startsidans inställningar, kortens plats, meddelanden och skakning
  const { store, global, SPEED, UNDO, HINTS, FACE, BACK, fmt, btnText, place, instant, toast, shake } = Game.init(board);

  let st = null, hist = [], els = [], M = null, drag = null;
  let hintIdx = 0, hintTimer = 0, paused = false;

  // Statistiken sparas per variant i samma form som Spiders: "classic" eller "wrap" (runt hörnet)
  const LEVELS = ['classic', 'wrap'];
  function loadStats() {
    const s = store.get('golf.stats') || {};
    for (const k of LEVELS) s[k] = s[k] || { played:0, won:0, best:0, fast:0 };
    return s;
  }
  const saveStats = s => store.set('golf.stats', s);
  const save = () => st && store.set('golf.game', { st, hist });

  // Animationer, tips, ljud och kortens utseende är övergripande inställningar (startsidan). Varianten är Golfs egen.
  const SKEY = 'golf.settings';
  const settings = Object.assign({ variant: 'classic' }, store.get(SKEY) || {});

  // ---------- Regler ----------
  // Sju kolumner med fem kort var, alla med framsidan upp. Det översta kortet i en kolumn får läggas på kasthögen
  // om det är ett steg högre eller lägre än kasthögens översta kort, oavsett färg. Klassisk: inget får läggas på en kung.
  // Runt hörnet: ess och kung hänger ihop (A på K och K på A).
  const N = 35;
  const rank = id => st.deck[id].r;
  const top = () => st.waste[st.waste.length - 1];
  const fits = (a, b) => st.variant === 'wrap' ? Math.abs(a - b) === 1 || Math.abs(a - b) === 12 : b !== 13 && Math.abs(a - b) === 1;
  const colOf = id => st.cols.findIndex(col => col[col.length - 1] === id);
  const playable = id => colOf(id) >= 0 && fits(rank(id), rank(top()));
  const findMoves = () => st.cols.filter(col => col.length).map(col => col[col.length - 1]).filter(playable);
  const cleared = () => N - st.cols.reduce((n, col) => n + col.length, 0);

  // ---------- Spelflöde ----------
  function newGame() {
    const { variant } = settings;
    const stats = loadStats(); stats[variant].played++; saveStats(stats);
    const deck = [];
    for (let s = 0; s < 4; s++) for (let r = 1; r <= 13; r++) deck.push({ s, r });
    const ids = deck.map((_, i) => i);
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    const cols = [...Array(7)].map(() => ids.splice(0, 5));
    // Det första kortet i draghögen vänds upp och startar kasthögen
    st = { deck, cols, stock: ids, waste: [ids.pop()], score: 0, streak: 0, moves: 0, time: 0, variant, won: false };
    hist = []; clearHint(); buildCards();
    instant(() => els.forEach(e => { place(e, M.sx, M.sy); e.className = 'card'; }));
    const delay = {};
    st.cols.forEach((col, c) => col.forEach((id, k) => delay[id] = (k * 7 + c) * 30));
    delay[top()] = N * 30 + 100;
    render({ delay }); save();
  }
  function snapshot() { return JSON.stringify({ cols: st.cols, stock: st.stock, waste: st.waste, score: st.score, streak: st.streak }); }
  function pushHist() { if (!UNDO) return; hist.push(snapshot()); if (hist.length > UNDO) hist.shift(); }
  function after(anim) {
    clearHint(); render(anim); save();
    if (cleared() === N && !st.won) win();
    else if (stuck()) setTimeout(() => {
      if (!st || st.won || !stuck()) return;
      showLost();
    }, 700);
  }
  // Inga drag kvar: inget kort passar och draghögen är tom
  const stuck = () => !st.won && !st.stock.length && !findMoves().length;
  // Lägg ett kort från en kolumn på kasthögen. Varje kort ger 10 poäng plus 5 för varje kort i följd sedan senaste dragningen.
  // Tomma kolumner ger 250 extra och 25 för varje kort som är kvar i draghögen.
  function play(id) {
    pushHist();
    st.cols[colOf(id)].pop(); st.waste.push(id);
    st.score += 10 + 5 * st.streak; st.streak++;
    if (cleared() === N) st.score += 250 + 25 * st.stock.length;
    st.moves++;
    after({ vol: MOVE_VOL });
  }
  // Dra ett kort från draghögen till kasthögen. Serien bryts.
  function draw() {
    if (drag || !st || st.won || !st.stock.length) return;
    pushHist(); st.waste.push(st.stock.pop()); st.streak = 0;
    st.moves++;
    after({ vol: .6 });
  }
  function undo() {
    if (!UNDO) { toast(t('toastUndoOff')); return; }
    if (drag || !hist.length || st.won) return;
    const moves = st.moves;
    Object.assign(st, JSON.parse(hist.pop()));
    st.moves = moves + 1;
    after({ vol: MOVE_VOL });
  }
  function win() {
    st.won = true; save(); updateHud();
    const stats = loadStats(), s = stats[st.variant];
    s.won++; if (st.score > s.best) s.best = st.score;
    if (!s.fast || st.time < s.fast) s.fast = st.time;   // snabbaste vinst i sekunder
    saveStats(stats);
    setTimeout(() => { $('win-text').textContent = t('winStats', { score: st.score, moves: st.moves, time: fmt(st.time) }); open('win'); }, 900);
  }

  // ---------- Tips ----------
  function hint() {
    if (!HINTS) { toast(t('toastHintsOff')); return; }
    if (!st || st.won) return;
    clearHintMarks();
    const moves = findMoves();
    if (!moves.length) {
      if (st.stock.length) {
        const b = $('b-draw'); b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
        toast(t('toastNoFitDraw'));
      } else toast(t('toastNoMoves'));
      return;
    }
    els[moves[hintIdx++ % moves.length]].classList.add('hint');
    hintTimer = setTimeout(clearHintMarks, 1600);
  }
  function clearHintMarks() { clearTimeout(hintTimer); board.querySelectorAll('.hint').forEach(e => e.classList.remove('hint')); }
  function clearHint() { hintIdx = 0; clearHintMarks(); }

  // ---------- Layout & rendering ----------
  function buildCards() {
    els.forEach(e => e.remove());
    els = st.deck.map((c, id) => {
      const e = document.createElement('div');
      e.className = 'card'; e.dataset.id = id;
      e.innerHTML = CardFaces.html(c, FACE);
      board.appendChild(e);
      return e;
    });
  }
  const put = (e, x, y) => { e.style.left = x + 'px'; e.style.top = y + 'px'; };
  const STEP = .3;   // hur mycket av kortet under som syns i en kolumn
  function layout() {
    const W = board.clientWidth, H = board.clientHeight, br = board.getBoundingClientRect();
    // Korten får ytan mellan banderollen och dockan
    const T = document.querySelector('.hud').getBoundingClientRect().bottom - br.top + 16;
    const B = document.querySelector('.dock').getBoundingClientRect().top - br.top - 16;
    const land = W > H, LBL = 24;   // LBL: plats för etiketten under draghög och kasthög
    // Kolumnerna överst, draghögen och kasthögen bredvid varandra i mitten under (som i Pyramid stående)
    const gapR = land ? .25 : .16, colH = 1.4 * (1 + 4 * STEP), space = land ? .45 : .6;
    const under = Math.min((W - (land ? 120 : 32)) / (7 + 6 * gapR), (B - T - LBL) / (colH + space + 1.4), 140);
    // På en låg skärm (telefon på bredden) får korten mer plats om draghögen ligger till vänster och kasthögen till höger
    // Kanten på en iPhone (kameraurtaget) läses av från ringen, som ligger 14 px innanför safe-area
    const inset = Math.max(0, $('ring').getBoundingClientRect().left - br.left - 14);
    const beside = land ? Math.min((W - 2 * inset - 80) / (7 + 6 * gapR + 2 * 1.6), (B - T - LBL) / colH, 140) : 0;
    const sides = beside > under * 1.15, cw = sides ? beside : under;
    const ch = cw * 1.4, gap = cw * gapR, colsW = 7 * cw + 6 * gap;
    const pos = [...Array(7)].map((_, c) => W / 2 - colsW / 2 + c * (cw + gap));
    let ctop, sx, sy, wx;
    if (sides) {
      ctop = T + (B - T - LBL - colH * cw) / 2;
      sy = ctop + colH * cw / 2 - ch / 2; const side = (W - colsW - 2 * inset) / 4;
      sx = inset + side - cw / 2; wx = W - inset - side - cw / 2;
    } else {
      ctop = T + (B - T - (colH * cw + space * cw + ch + LBL)) / 2;
      sy = ctop + colH * cw + space * cw; sx = W / 2 - cw - 16; wx = W / 2 + 16;
    }
    M = { W, H, cw, ch, pos, ctop, sx, sy, wx, wy: sy };
    board.style.setProperty('--cw', cw + 'px');
    board.style.setProperty('--ch', ch + 'px');
    put($('stock-slot'), sx, sy); put($('waste-slot'), wx, sy);
    [['stock-lbl', sx], ['waste-lbl', wx]].forEach(([id, x]) => { put($(id), x - cw / 2, sy + ch + 8); $(id).style.width = 2 * cw + 'px'; });
    put($('stock-n'), sx + cw - 16, sy - 10);
  }
  const MOVE_VOL = .4;   // spelarens egna flyttar (och ångra) låter svagare än utdelningen
  function render(anim = {}) {
    const delay = anim.delay || {};
    const quiet = board.classList.contains('noanim');
    const set = (id, x, y, z, cls) => {
      const e = els[id];
      // Ett kort som flyttas låter när det landar: efter sin fördröjning och ca 60 % av rörelsen
      if (!quiet && (Math.abs(e._x - x) > 8 || Math.abs(e._y - y) > 8))
        CardSounds.place(((delay[id] || 0) + 180) * SPEED, anim.vol ?? 1);
      // Skriv bara det som har ändrats, så att webbläsaren inte behöver räkna om kort som ligger still
      const zs = String(z), dl = (delay[id] || 0) * SPEED + 'ms';
      if (e._x !== x || e._y !== y) place(e, x, y);
      if (e.style.zIndex !== zs) e.style.zIndex = zs;
      if (e.className !== cls) e.className = cls;
      if (e.style.transitionDelay !== dl) e.style.transitionDelay = dl;
    };
    st.stock.forEach((id, j) => set(id, M.sx, M.sy, 10 + j, 'card'));
    st.waste.forEach((id, j) => set(id, M.wx, M.wy, 100 + j, 'card up'));
    st.cols.forEach((col, c) => col.forEach((id, k) => {
      const last = k === col.length - 1;
      set(id, M.pos[c], M.ctop + k * M.ch * STEP, 200 + k, 'card up' + (!last ? ' dim' : HINTS && playable(id) ? ' can' : ''));
    }));
    updateHud();
  }
  function updateHud() {
    $('score').textContent = st.score;
    $('moves').textContent = st.moves;
    $('time').textContent = fmt(st.time);
    $('left').textContent = st.stock.length;
    const c = cleared();
    $('cleared').textContent = c + '/' + N;
    $('ring').style.setProperty('--p', c / N * 100);
    $('stock-n').textContent = st.stock.length;
    $('stock-n').style.display = st.stock.length ? '' : 'none';
    $('stock-slot').classList.toggle('empty', !st.stock.length);
    $('draw-lbl').textContent = t('draw', st.stock.length);
    $('b-draw').disabled = st.won || !st.stock.length;
    $('b-undo').disabled = UNDO > 0 && (!hist.length || st.won);
  }

  // ---------- Touch / mus ----------
  // Tryck på ett kort som passar, eller dra det till kasthögen. Tryck på draghögen för att dra ett kort.
  const clearTarget = () => board.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  function overWaste(e) {
    return document.elementsFromPoint(e.clientX, e.clientY).some(n => n.id === 'waste-slot' || (n.closest && n.closest('.card') && st.waste.includes(+n.closest('.card').dataset.id)));
  }
  board.addEventListener('pointerdown', e => {
    if (drag || !st || st.won) return;
    if (relayout()) return;   // skärmen har vridits utan att vi märkt det: rätta layouten först
    const el = e.target.closest('.card');
    if (e.target.closest('#stock-slot') || (el && st.stock.includes(+el.dataset.id))) { draw(); return; }
    if (!el) return;
    const id = +el.dataset.id;
    if (st.waste.includes(id)) return;
    if (!playable(id)) { shake([el]); return; }
    drag = { id, el, pid: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, moving: false };
  });
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    drag.dx = e.clientX - drag.x0; drag.dy = e.clientY - drag.y0;
    if (!drag.moving && Math.hypot(drag.dx, drag.dy) < 8) return;
    if (!drag.moving) { drag.moving = true; drag.el.classList.add('dragging'); drag.el.style.zIndex = 5000; clearHintMarks(); }
    drag.el.style.translate = `${drag.el._x + drag.dx}px ${drag.el._y + drag.dy}px`;
    clearTarget();
    if (overWaste(e)) (st.waste.length ? els[top()] : $('waste-slot')).classList.add('target');
  });
  function endDrag(e, cancel) {
    if (!drag || e.pointerId !== drag.pid) return;
    const g = drag; drag = null; clearTarget();
    if (g.moving) {
      // Flytta in fingrets förskjutning i kortets plats innan animationen, så att den startar där kortet släpptes (som i Spider)
      place(g.el, g.el._x + g.dx, g.el._y + g.dy);
      void board.offsetWidth;
      if (!cancel && overWaste(e)) play(g.id); else render({ vol: MOVE_VOL });
    } else if (!cancel) play(g.id);
    setTimeout(relayout, 400);   // om skärmen vreds under draget
  }
  window.addEventListener('pointerup', e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  // ---------- Knappar & dialoger ----------
  function close(id) { $(id).classList.remove('open'); paused = !!document.querySelector('.overlay.open'); }
  const levelName = variant => t(variant === 'wrap' ? 'wrap' : 'classic');
  // Slutdialogernas knappar: rubrik plus en rad om vad som händer, och Nytt spel visar inställningarna det startas med
  function fillEnd() {
    const next = btnText(t('newGame'), levelName(settings.variant)), change = btnText(t('changeGame'), t('golfChangeSub'));
    $('w-change').innerHTML = $('lo-change').innerHTML = change;
    $('w-new').innerHTML = $('lo-new').innerHTML = next;
    $('lo-undo').innerHTML = btnText(t('undo'), t('undoSub'));
    $('lo-undo').style.display = UNDO ? '' : 'none';
  }
  function open(id) { if (id === 'win' || id === 'lost') fillEnd(); paused = true; $(id).classList.add('open'); }
  const inProgress = () => st && !st.won && st.moves > 0 && !stuck();
  // Ett fastlåst spel finns kvar att fortsätta (sidan Spela visar Fortsätt), och då visas Inga fler drag igen
  const resumable = () => st && !st.won && st.moves > 0;
  function showLost() {
    $('lost-text').textContent = t('winStats', { score: st.score, moves: st.moves, time: fmt(st.time) });
    open('lost');
  }
  function refreshLobby() {
    document.querySelectorAll('#lobby .seg').forEach(seg => {
      const v = String(settings[seg.dataset.key]);
      seg.querySelectorAll('.btn').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    });
    $('rules').textContent = t('golfRules') + ' ' + t(settings.variant === 'wrap' ? 'golfWrapRules' : 'golfClassicRules');
    const s = loadStats()[settings.variant];
    $('st-played').textContent = s.played; $('st-won').textContent = s.won; $('st-best').textContent = s.best || '–';
    const going = resumable();
    $('l-resume').style.display = going ? '' : 'none';
    if (going) $('l-resume').innerHTML = `${t('resume')}<small>${levelName(st.variant)} · ${t('golfProgress', cleared())}</small>`;
    $('l-play').className = going ? 'btn' : 'btn gold';
    $('l-play').innerHTML = `${going ? t('newGame') : t('play')}<small>${levelName(settings.variant)}</small>`;
  }
  function showLobby() { refreshLobby(); open('lobby'); }
  document.querySelectorAll('#lobby .seg').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('.btn');
    if (!b) return;
    settings[seg.dataset.key] = b.dataset.v;
    store.set(SKEY, settings);
    refreshLobby();
  }));
  $('b-draw').onclick = draw;
  $('b-undo').onclick = undo;
  $('b-hint').onclick = hint;
  $('b-menu').onclick = showLobby;
  $('b-new').onclick = () => { if (inProgress()) open('confirm'); else newGame(); };
  $('l-resume').onclick = () => { close('lobby'); if (stuck()) showLost(); };
  $('l-play').onclick = () => { if (inProgress()) open('confirm'); else { close('lobby'); newGame(); } };
  $('l-home').onclick = () => { save(); location.href = 'games.html'; };
  $('c-no').onclick = () => close('confirm');
  $('c-yes').onclick = () => { close('confirm'); close('lobby'); newGame(); };
  $('w-new').onclick = () => { close('win'); newGame(); };
  $('lo-undo').onclick = () => { close('lost'); undo(); };
  $('lo-new').onclick = () => { close('lost'); newGame(); };
  $('lo-change').onclick = () => { close('lost'); showLobby(); };
  $('w-change').onclick = () => { close('win'); showLobby(); };
  document.addEventListener('keydown', e => {
    if (paused) return;
    if (e.key === 'z' || e.key === 'Z') undo();
    else if (e.key === 'd' || e.key === ' ') { e.preventDefault(); draw(); }
    else if (e.key === 'h') hint();
  });

  // Räkna om layouten när skärmen ändrar storlek (game.js lyssnar efter vridning och storleksändring)
  function relayout() {
    if (drag || !M || (M.W === board.clientWidth && M.H === board.clientHeight)) return false;
    layout(); if (st) instant(() => render());
    return true;
  }
  // Tidtagning, sparande när appen stängs, omräkning vid vridning och offline-stöd (game.js)
  Game.watch({ board, game: () => st, paused: () => paused, save, relayout });

  // ---------- Start ----------
  layout();
  const saved = store.get('golf.game');
  if (saved && saved.st && saved.st.deck && saved.st.deck.length === 52 && saved.st.cols && !saved.st.won && saved.st.moves > 0) {
    st = saved.st; hist = UNDO ? (saved.hist || []).slice(-UNDO) : [];
    buildCards();
    instant(() => render());
  }
  showLobby();
})();
</script>
