<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solitaires">
<meta name="theme-color" content="#10152e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Solitaires</title>
<link rel="stylesheet" href="cards.css">
<script src="i18n.js"></script>
<script src="cards.js"></script>
<script src="games.js"></script>
<style>
  :root { --gold:#f5d58a; --gold2:#c9a24a; --ink:#e9dfc4; --navy:#141a35;
          --u:min(1vw, calc(var(--app-h,100vh) / 75)); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:var(--app-h,100%); overflow:hidden; overscroll-behavior:none; background:#0b0f22; }
  /* Hela appen täcker skärmen. Överkanten har samma färg som statusfältet (theme-color #10152e). */
  #app { position:fixed; top:0; left:0; right:0; height:var(--app-h,100%); overflow:hidden;
         background:linear-gradient(180deg,#10152e env(safe-area-inset-top),rgba(16,21,46,0) calc(env(safe-area-inset-top) + 90px)), radial-gradient(circle at 50% 38%,#2a3566 0%,#141a35 50%,#0b0f22 100%); }
  body { color:var(--ink);
         font-family:-apple-system,"Segoe UI",system-ui,sans-serif; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
         transition:opacity .25s; }
  body.leaving { opacity:0; }

  /* Bakgrund: stjärnor, ram och hörn */
  .stars { position:absolute; inset:0; pointer-events:none; }
  .star { position:absolute; width:var(--s); height:var(--s); margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2); border-radius:50%;
          background:#fff; box-shadow:0 0 calc(var(--s) * 2) rgba(255,255,255,.7); animation:twinkle var(--t) ease-in-out var(--d) infinite; }
  .star.gold { background:var(--gold); box-shadow:0 0 calc(var(--s) * 2.5) rgba(245,213,138,.8); }
  .star.spark { border-radius:0; background:var(--gold); box-shadow:none; filter:drop-shadow(0 0 3px rgba(245,213,138,.9));
                clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%); animation-name:sparkle; }
  @keyframes twinkle { 0%,100% { opacity:.25; transform:scale(.7); } 50% { opacity:1; transform:scale(1); } }
  @keyframes sparkle { 0%,100% { opacity:.15; transform:scale(.4) rotate(0deg); } 50% { opacity:1; transform:scale(1) rotate(45deg); } }
  .frame { position:absolute; pointer-events:none;
           top:calc(env(safe-area-inset-top) + max(2.6 * var(--u), 12px)); bottom:calc(env(safe-area-inset-bottom) + max(2.6 * var(--u), 12px));
           left:calc(env(safe-area-inset-left) + max(2.6 * var(--u), 12px)); right:calc(env(safe-area-inset-right) + max(2.6 * var(--u), 12px));
           border:1px solid rgba(245,213,138,.5); border-radius:4px; }
  .frame::before { content:""; position:absolute; inset:max(.8 * var(--u), 5px); border:1px solid rgba(245,213,138,.22); }
  .corner { position:absolute; width:max(6 * var(--u), 34px); height:max(6 * var(--u), 34px); border:max(.3 * var(--u), 2px) solid var(--gold); }
  .corner::after { content:"◆"; position:absolute; color:var(--gold); font-size:max(1.4 * var(--u), 9px); }
  .c1 { top:-1px; left:-1px; border-right:0; border-bottom:0; } .c1::after { top:20%; left:20%; }
  .c2 { top:-1px; right:-1px; border-left:0; border-bottom:0; } .c2::after { top:20%; right:20%; }
  .c3 { bottom:-1px; left:-1px; border-right:0; border-top:0; } .c3::after { bottom:20%; left:20%; }
  .c4 { bottom:-1px; right:-1px; border-left:0; border-top:0; } .c4::after { bottom:20%; right:20%; }

  /* Svävande kort */
  .card { position:absolute; width:max(13 * var(--u), 70px); height:calc(max(13 * var(--u), 70px) * 1.4); border-radius:9%/6.5%;
          background:linear-gradient(180deg,#fffaf0,#f3ead6); border:1px solid #d6c08a; box-shadow:0 1.2vmin 2.6vmin rgba(0,0,0,.5);
          font-family:Georgia,serif; pointer-events:none; animation:bob 7s ease-in-out infinite; }
  .card .r { position:absolute; top:6%; left:9%; font-size:max(2.8 * var(--u), 15px); font-weight:700; line-height:1; }
  .card .s { position:absolute; top:6%; right:9%; font-size:max(2.4 * var(--u), 13px); line-height:1; }
  .card .b { position:absolute; inset:auto 0 8% 0; text-align:center; font-size:max(6.5 * var(--u), 34px); line-height:1; }
  .card.back { background:radial-gradient(circle at 50% 50%,#3a2c6e 0 22%,transparent 23%),repeating-radial-gradient(circle at 50% 50%,#24305e 0 6px,#1b2450 6px 12px);
               border:max(.35 * var(--u), 2px) solid #c9a95a; }
  /* Kortens underkant ligger i höjd med medaljongens underkant (ca 43 % av höjden) */
  .card.left { left:12%; top:calc(44% - max(13 * var(--u), 70px) * 1.33); --rot:-14deg; }
  .card.right { right:12%; top:calc(43% - max(13 * var(--u), 70px) * 1.33); --rot:12deg; animation-delay:-3.5s; }
  @keyframes bob { 0%,100% { transform:translateY(0) rotate(var(--rot)) scale(.85); } 50% { transform:translateY(-1.6vmin) rotate(calc(var(--rot) * 1.15)) scale(.85); } }
  .red { color:#c8102e; }
  @media (max-aspect-ratio:3/4) { .card.left { left:7%; top:12%; } .card.right { right:7%; top:12%; } }
  @media (max-width:520px) { .card { display:none; } }

  /* Mitten: medaljong, titel, knappar */
  .stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .medal-wrap { position:relative; width:max(22 * var(--u), 120px); height:max(22 * var(--u), 120px); }
  .rays { position:absolute; left:50%; top:50%; width:170vmax; height:170vmax; margin:-85vmax 0 0 -85vmax; pointer-events:none; z-index:-1;
          background:repeating-conic-gradient(rgba(245,213,138,.075) 0 4deg,transparent 4deg 12deg);
          -webkit-mask:radial-gradient(circle,#000 0 8%,transparent 40%); mask:radial-gradient(circle,#000 0 8%,transparent 40%);
          animation:spin 140s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .medal { position:absolute; inset:0; border-radius:50%; display:grid; place-items:center;
           background:radial-gradient(circle at 40% 30%,#2e3a75,#141a35 70%); border:max(.5 * var(--u), 3px) solid var(--gold);
           box-shadow:0 0 0 max(1 * var(--u), 6px) rgba(245,213,138,.12), 0 0 0 max(1.3 * var(--u), 8px) rgba(245,213,138,.4), 0 0 5vmin rgba(245,213,138,.35);
           animation:glow 5s ease-in-out infinite, pop .9s cubic-bezier(.2,1.4,.4,1) both; }
  .medal span { font-size:max(12 * var(--u), 64px); line-height:1; color:var(--gold); text-shadow:0 .4vmin 1vmin rgba(0,0,0,.5); margin-top:-6%; }
  @keyframes glow { 50% { box-shadow:0 0 0 max(1 * var(--u), 6px) rgba(245,213,138,.16), 0 0 0 max(1.3 * var(--u), 8px) rgba(245,213,138,.55), 0 0 9vmin rgba(245,213,138,.5); } }
  @keyframes pop { from { transform:scale(.6); opacity:0; } }
  .suits { display:flex; gap:max(2.4 * var(--u), 14px); margin-top:max(2.4 * var(--u), 16px); font-size:max(1.8 * var(--u), 12px); color:var(--gold); opacity:.8; }
  h1 { margin:max(1.2 * var(--u), 8px) 0 0; font:400 max(6.4 * var(--u), 30px)/1.1 Georgia,"Times New Roman",serif; color:var(--gold);
       letter-spacing:.32em; text-indent:.32em; text-transform:uppercase; text-shadow:0 .3vmin 1.2vmin rgba(0,0,0,.4); }
  .sub { margin-top:max(1.4 * var(--u), 8px); font-size:max(1.5 * var(--u), 10px); letter-spacing:.6em; text-indent:.6em; text-transform:uppercase; opacity:.6; }
  .menu { display:flex; flex-wrap:wrap; justify-content:center; gap:max(2.4 * var(--u), 14px); margin-top:max(5 * var(--u), 28px); }
  .fade { animation:rise .8s cubic-bezier(.2,.8,.2,1) both; }
  .d1 { animation-delay:.15s; } .d2 { animation-delay:.3s; } .d3 { animation-delay:.45s; }
  @keyframes rise { from { opacity:0; transform:translateY(2vmin); } }

  .deco { all:unset; position:relative; box-sizing:border-box; cursor:pointer; touch-action:manipulation;
          width:max(27 * var(--u), 168px); height:max(11 * var(--u), 68px); display:flex; flex-direction:column; align-items:center; justify-content:center;
          font-family:Georgia,serif; letter-spacing:.18em; text-transform:uppercase; font-size:max(1.9 * var(--u), 14px);
          clip-path:polygon(6% 0,94% 0,100% 50%,94% 100%,6% 100%,0 50%); transition:transform .12s, filter .2s; }
  .deco small { font-family:-apple-system,"Segoe UI",sans-serif; text-transform:none; letter-spacing:.04em; font-size:max(1.25 * var(--u), 11px); opacity:.75; margin-top:max(.6 * var(--u), 4px); }
  .deco:active { transform:scale(.96); }
  .deco:hover { filter:brightness(1.08); }
  .deco.gold { background:linear-gradient(180deg,var(--gold),var(--gold2)); color:#1b1b2e; font-weight:700; }
  .deco.line { background:linear-gradient(180deg,var(--gold),var(--gold2)); color:var(--gold); }
  .deco.line::before { content:""; position:absolute; inset:2px; background:var(--navy); clip-path:inherit; }
  .deco.line > * { position:relative; }
  .version { position:absolute; bottom:calc(env(safe-area-inset-bottom) + max(4.4 * var(--u), 22px)); left:0; right:0; text-align:center;
             font-size:11px; letter-spacing:.2em; opacity:.35; pointer-events:none; }

  /* Inställningar */
  .overlay { position:fixed; top:0; left:0; right:0; height:var(--app-h,100%); background:rgba(5,8,20,.6); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
             display:none; place-items:center; z-index:10; padding:16px; }
  .overlay.open { display:grid; animation:fadein .2s; }
  @keyframes fadein { from { opacity:0; } }
  .panel { position:relative; width:min(480px,100%); max-height:calc(var(--app-h,100vh) - 32px); overflow:auto; -webkit-overflow-scrolling:touch;
           background:linear-gradient(180deg,#1d2550,#141a35); border:1px solid rgba(245,213,138,.5); border-radius:6px;
           padding:30px 26px 24px; box-shadow:0 0 0 6px rgba(20,26,53,.9), 0 0 0 7px rgba(245,213,138,.25), 0 30px 80px rgba(0,0,0,.6); }
  .panel h2 { margin:0 0 4px; text-align:center; color:var(--gold); font:400 24px Georgia,serif; letter-spacing:.24em; text-indent:.24em; text-transform:uppercase; }
  .panel .orn { text-align:center; color:var(--gold); font-size:11px; letter-spacing:.6em; opacity:.7; margin-bottom:18px; }
  .group { margin-top:18px; }
  @media (orientation:portrait) { #settings .group { margin-top:16px; } }   /* så att inställningarna ryms på en stående iPad */
  .group .label { font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.75; margin-bottom:8px; display:flex; justify-content:space-between; }
  .group .label em { font-style:normal; letter-spacing:0; text-transform:none; opacity:.8; }
  .seg { display:flex; background:rgba(255,255,255,.06); border-radius:12px; padding:4px; }
  .seg button { all:unset; flex:1; text-align:center; padding:10px 4px; border-radius:9px; cursor:pointer; font-size:14px; touch-action:manipulation; }
  .seg button.on { background:linear-gradient(180deg,var(--gold),var(--gold2)); color:#1b1b2e; font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
  th { font-weight:400; font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.6; text-align:right; padding:0 0 6px; }
  th:first-child, td:first-child { text-align:left; }
  td { padding:7px 0; border-top:1px solid rgba(255,255,255,.08); text-align:right; }
  td b { color:var(--gold); font-weight:400; font-family:Georgia,serif; font-size:16px; }
  .panel.wide { width:min(640px,100%); }
  /* Inställningar: två kolumner i liggande läge så att allt får plats utan att scrolla */
  @media (orientation:landscape) and (min-width:820px) {
    #settings .panel { width:min(860px,100%); }
    #settings .cols { display:grid; grid-template-columns:1fr 1fr; gap:0 34px; }
    /* Statistik: trofésalen till vänster och det valda spelets detaljer till höger */
    #stats .panel { width:min(1100px,100%); }
    #stats-body { display:grid; grid-template-columns:360px 1fr; gap:26px; align-items:start; }
    #stats-body .hall { grid-template-columns:repeat(3,1fr); }   /* tre medaljer i bredd, resten av bredden går till statistiken */
    #stats-body .side { margin-top:0; }
  }
  /* Trofésalen: varje spel är en medalj med en guldring som fylls efter vinstprocenten. Tryck på en för detaljerna. */
  .hall { display:grid; grid-template-columns:repeat(4,1fr); gap:16px 8px; }
  .tro { all:unset; cursor:pointer; text-align:center; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .tro .rg { width:96px; height:96px; margin:0 auto; border-radius:50%; display:grid; place-items:center; transition:box-shadow .2s, transform .12s; }
  .tro:active .rg { transform:scale(.95); }
  .tro .ico { width:78px; height:78px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--gold);
              background:radial-gradient(circle at 40% 30%,#2e3a75,#141a35 70%); }
  .tro .ico svg { width:42px; height:42px; display:block; overflow:visible; }
  .tro .nm { margin-top:8px; font:400 16px Georgia,serif; color:var(--gold); }
  .tro .sm { font-size:13.5px; opacity:.75; margin-top:2px; font-variant-numeric:tabular-nums; }
  .tro.on .rg { box-shadow:0 0 0 3px rgba(245,213,138,.25), 0 0 22px rgba(245,213,138,.55); }
  .side { margin-top:18px; padding:16px; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid rgba(245,213,138,.22); }
  /* Statistiken har en fast storlek: panelen har fast bredd, och höjden låses i fitStats() till det spel som har
     flest nivåer, så fönstret inte ändrar storlek när man byter spel. Detaljrutan är bara så hög som sitt innehåll. */
  #stats .panel { width:min(780px,100%); }
  @media (orientation:landscape) and (min-width:820px) { #stats .panel { width:min(1100px,100%); } }
  /* Fasta kolumnbredder: nivån får en tredjedel och de andra kolumnerna delar lika, oavsett vilket spel som visas */
  #stats table { table-layout:fixed; } #stats th:first-child { width:33%; }
  #stats table { font-size:15.5px; } #stats td { padding:8px 0; } #stats th { font-size:12px; } #stats td b { font-size:17px; }
  .side h3 { margin:0 0 12px; text-align:center; font:400 20px Georgia,serif; color:var(--gold); letter-spacing:.08em; }
  @media (max-width:520px) {
    .hall { gap:12px 4px; }
    .tro .rg { width:64px; height:64px; } .tro .ico { width:52px; height:52px; } .tro .ico svg { width:28px; height:28px; }
    .tro .nm { font-size:12px; } .tro .sm { font-size:11px; }
    #stats table { font-size:13px; } #stats td { padding:5px 0; } #stats th { font-size:10.5px; } #stats td b { font-size:15px; }
    #stats .summary b { font-size:21px; } #stats .summary div { padding:7px 4px; } .side { padding:12px; margin-top:12px; } .side h3 { margin-bottom:8px; }
  }
  .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .summary div { background:rgba(255,255,255,.05); border:1px solid rgba(245,213,138,.15); border-radius:10px; padding:10px 6px;
                 text-align:center; font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
  .summary b { display:block; font:400 26px Georgia,serif; color:var(--gold); letter-spacing:0; margin-bottom:2px; }
  tr.total td { font-weight:700; border-top:1px solid rgba(245,213,138,.35); }
  @media (max-width:520px) { .hide-sm { display:none; } }
  .pbtn { all:unset; display:block; box-sizing:border-box; width:100%; text-align:center; padding:13px; border-radius:12px; margin-top:12px;
          cursor:pointer; font-size:15px; touch-action:manipulation; background:rgba(255,255,255,.08); }
  .pbtn.gold { background:linear-gradient(180deg,var(--gold),var(--gold2)); color:#1b1b2e; font-weight:700; margin-top:22px; }
  .pbtn.warn { background:transparent; border:1px solid rgba(255,255,255,.15); font-size:13px; }
  .pbtn.warn.armed { border-color:#e5484d; color:#ff8a8d; }
  /* Förhandsvisning av korten (utseendet kommer från cards.css) */
  .pv { display:flex; gap:10px; justify-content:center; margin-top:12px; padding:14px 8px; border-radius:12px;
        background:radial-gradient(circle at 50% 40%,#2a3566 0%,#141a35 70%); --cw:58px; --ch:81px; }
  .pv .card { position:relative; inset:auto; width:var(--cw); height:var(--ch); border-radius:calc(var(--cw) * .09); overflow:hidden;
              box-shadow:0 3px 8px rgba(0,0,0,.45); animation:none; transform:none; flex:none; }

  @media (prefers-reduced-motion:reduce) { .rays, .card, .medal, .star { animation:none; } .fade { animation:none; } }
  body.calm .rays, body.calm .card, body.calm .medal, body.calm .star { animation:none; }

  /* iOS/iPadOS 27 suddar till överkanten i hemskärmsappar. Ett fast element överst (minst 90 % brett,
     över 10 px högt) får WebKit att färga kanten i elementets bakgrundsfärg i stället. background-clip:text
     gör att remsan själv inte ritar något. Färgen är densamma som theme-color och bakgrundens överkant. */
  .remove-blur { display:none; }
  @media (display-mode: standalone) {
    .remove-blur { display:block; position:fixed; inset:0 0 auto; height:max(11px, env(safe-area-inset-top)); z-index:2147483647; pointer-events:none;
                   background:#10152e; -webkit-background-clip:text; background-clip:text; }
  }
</style>
</head>
<body>
<div class="remove-blur" aria-hidden="true"></div>
<div id="app">
<div class="stars"></div>
<div class="frame"><div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div></div>
<div class="card left red"><span class="r">A</span><span class="s">♥&#xFE0E;</span><span class="b">♥&#xFE0E;</span></div>
<div class="card right back"></div>

<main class="stage">
  <div class="medal-wrap"><div class="rays"></div><div class="medal"><span>♠&#xFE0E;</span></div></div>
  <div class="suits fade d1"><span>♠&#xFE0E;</span><span>♥&#xFE0E;</span><span>♦&#xFE0E;</span><span>♣&#xFE0E;</span></div>
  <h1 class="fade d1">Solitaires</h1>
  <div class="sub fade d2" data-i18n="subtitle">Solitaire for iPad</div>
  <div class="menu fade d3">
    <button class="deco gold" id="play"><span data-i18n="play">Play</span><small data-i18n="playSub">Choose a game</small></button>
    <button class="deco line" id="open-stats"><span data-i18n="stats">Statistics</span><small data-i18n="statsSub">Results &amp; records</small></button>
    <button class="deco line" id="open-settings"><span data-i18n="settings">Settings</span><small data-i18n="settingsSub">Appearance &amp; data</small></button>
  </div>
</main>
<div class="version">v1.5.1028.1217</div>
</div>

<div class="overlay" id="stats"><div class="panel wide">
  <h2 data-i18n="stats">Statistics</h2>
  <div class="orn">◆ ◆ ◆</div>
  <div id="stats-body"></div>
  <button class="pbtn gold" id="stats-close" data-i18n="done">Done</button>
</div></div>

<div class="overlay" id="settings"><div class="panel">
  <h2 data-i18n="settings">Settings</h2>
  <div class="orn">◆ ◆ ◆</div>

  <div class="cols"><div>
  <div class="group">
    <div class="label" data-i18n-html="sAnim">Animations <em>in all games</em></div>
    <div class="seg" data-key="anim"><button data-v="normal" data-i18n="animNormal">Normal</button><button data-v="fast" data-i18n="animFast">Fast</button><button data-v="off" data-i18n="off">Off</button></div>
  </div>
  <div class="group">
    <div class="label" data-i18n-html="sEffects">Background effects <em>stars, rays, glow</em></div>
    <div class="seg" data-key="effects"><button data-v="true" data-i18n="on">On</button><button data-v="false" data-i18n="off">Off</button></div>
  </div>
  <div class="group">
    <div class="label" data-i18n-html="sHints">Hints <em>the Hint button in all games</em></div>
    <div class="seg" data-key="hints"><button data-v="true" data-i18n="on">On</button><button data-v="false" data-i18n="off">Off</button></div>
  </div>
  <div class="group">
    <div class="label" data-i18n-html="sUndo">Undo <em>moves you can take back</em></div>
    <div class="seg" data-key="undo"><button data-v="0" data-i18n="off">Off</button><button data-v="1" data-i18n="undo1">1 move</button><button data-v="5" data-i18n="undo5">5 moves</button></div>
  </div>
  <div class="group">
    <div class="label" data-i18n-html="sSound">Sound <em>card sounds in all games</em></div>
    <div class="seg" data-key="sound"><button data-v="true" data-i18n="on">On</button><button data-v="false" data-i18n="off">Off</button></div>
  </div>
  <div class="group">
    <div class="label" data-i18n="sLang">Language</div>
    <div class="seg" data-key="lang"><button data-v="en">English</button><button data-v="sv">Svenska</button></div>
  </div>
  </div><div>
  <div class="group">
    <div class="label" data-i18n="sFace">Card front</div>
    <div class="seg" data-key="face"><button data-v="standard" data-i18n="faceStandard">Standard</button><button data-v="classic" data-i18n="faceClassic">Classic</button><button data-v="modern" data-i18n="faceModern">Modern</button></div>
  </div>
  <div class="group">
    <div class="label" data-i18n="sBack">Card back</div>
    <div class="seg" data-key="back"><button data-v="rings" data-i18n="backRings">Rings</button><button data-v="classic" data-i18n="backClassic">Burgundy</button><button data-v="deco" data-i18n="backDeco">Art deco</button></div>
    <div class="pv" id="card-preview"></div>
  </div>
  <div class="group">
    <div class="label" data-i18n="sData">Data</div>
    <button class="pbtn warn" id="reset-stats" data-i18n="resetStats">Reset statistics for all games</button>
    <button class="pbtn warn" id="reset-games" data-i18n="resetGames">Delete saved games</button>
  </div>
  </div></div>
  <button class="pbtn gold" id="close" data-i18n="done">Done</button>
</div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const t = I18N.t;
  I18N.apply();
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  // Övergripande inställningar. Spelens egna val sparas av respektive spel (t.ex. spider.settings).
  const SKEY = 'solitaires.settings';
  const g0 = store.get(SKEY) || {};
  const settings = { anim: g0.anim || 'normal', effects: g0.effects !== false, hints: g0.hints !== false, undo: [0, 1, 5].includes(g0.undo) ? g0.undo : 5, sound: g0.sound !== false,
                     face: g0.face || 'standard', back: g0.back || 'rings', lang: I18N.lang };

  // Alla spel finns i games.js (GAMES)
  const fmtTime = t => t ? Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') : '–';
  const pct = (won, played) => played ? Math.round(won / played * 100) + ' %' : '–';
  // Statistiken som en trofésal: en medalj per spel, och detaljerna för det valda spelet (först det mest spelade)
  let statSel = null;
  function gameStats(g) {
    const data = store.get(g.statsKey) || {};
    const rows = g.levels.map(l => Object.assign({ played: 0, won: 0, best: 0, fast: 0 }, data[l.key], { label: l.label }));
    const tot = rows.reduce((a, r) => ({
      label: t('total'), played: a.played + r.played, won: a.won + r.won, best: Math.max(a.best, r.best),
      fast: r.fast && (!a.fast || r.fast < a.fast) ? r.fast : a.fast,
    }), { played: 0, won: 0, best: 0, fast: 0 });
    return { rows, tot };
  }
  function renderStats(sel = statSel) {
    const all = GAMES.map(g => Object.assign({ g }, gameStats(g)));
    const hall = all.map(({ g, tot }) => {
      const p = tot.played ? tot.won / tot.played * 100 : 0;
      return `<button class="tro${g.id === sel ? ' on' : ''}" data-id="${g.id}"><div class="rg" style="background:conic-gradient(var(--gold) ${p}%, rgba(255,255,255,.1) 0)">` +
        `<div class="ico"><svg viewBox="0 0 48 48" aria-hidden="true">${g.svg}</svg></div></div><div class="nm">${g.name}</div><div class="sm">${tot.won}/${tot.played} · ${pct(tot.won, tot.played)}</div></button>`;
    }).join('');
    const { g, rows, tot } = all.find(a => a.g.id === sel);
    const row = (r, cls) => `<tr class="${cls || ''}"><td>${r.label}</td><td>${r.played}</td><td>${r.won}</td>` +
      `<td class="hide-sm">${pct(r.won, r.played)}</td><td><b>${r.best || '–'}</b></td><td>${fmtTime(r.fast)}</td></tr>`;
    const side = `<section class="side"><h3>${g.name}</h3>
      <div class="summary"><div><b>${tot.played}</b>${t('played')}</div><div><b>${tot.won}</b>${t('won')}</div><div><b>${pct(tot.won, tot.played)}</b>${t('winRate')}</div></div>
      <table><thead><tr><th>${t('level')}</th><th>${t('played')}</th><th>${t('won')}</th><th class="hide-sm">${t('winRate')}</th><th>${t('best')}</th><th>${t('fastest')}</th></tr></thead>
      <tbody>${rows.map(r => row(r)).join('')}${row(tot, 'total')}</tbody></table></section>`;
    $('stats-body').innerHTML = `<div class="hall">${hall}</div>${side}`;
  }
  // Öppna statistiken: först det mest spelade spelet. Höjden låses till det spel som har flest nivåer (mäts med
  // det spelet visat), så fönstret aldrig ändrar storlek när man byter spel. Räknas om när skärmen vrids.
  function fitStats() {
    const body = $('stats-body');
    if (!statSel || !GAMES.some(g => g.id === statSel))
      statSel = GAMES.map(g => [g.id, gameStats(g).tot.played]).sort((a, b) => b[1] - a[1])[0][0];
    body.style.minHeight = '';
    renderStats(GAMES.slice().sort((a, b) => b.levels.length - a.levels.length)[0].id);
    body.style.minHeight = body.offsetHeight + 'px';
    renderStats();
  }
  $('stats-body').addEventListener('click', e => { const b = e.target.closest('.tro'); if (b) { statSel = b.dataset.id; renderStats(); } });
  window.addEventListener('resize', () => { if ($('stats').classList.contains('open')) fitStats(); });
  const applyEffects = () => document.body.classList.toggle('calm', !settings.effects);
  applyEffects();

  // Stjärnhimmel: små vita och guldiga stjärnor plus några fyruddiga gnistor, alla i egen takt
  const sky = document.querySelector('.stars'), rnd = (a, b) => a + Math.random() * (b - a);
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('i');
    const kind = i < 8 ? 'spark' : i < 18 ? 'gold' : '';
    s.className = 'star ' + kind;
    s.style.cssText = `left:${rnd(2, 98)}%;top:${rnd(2, 98)}%;--s:${kind === 'spark' ? rnd(16, 24) : rnd(3, 5)}px;` +
                      `--t:${rnd(2.5, 6)}s;--d:${-rnd(0, 6)}s`;
    sky.appendChild(s);
  }

  // Förhandsvisning: några framsidor och en baksida i valda stilar
  const PREVIEW = [{ s: 1, r: 7 }, { s: 0, r: 12 }, { s: 2, r: 1 }];
  function refreshPreview() {
    const pv = $('card-preview');
    pv.className = `pv face-${settings.face} back-${settings.back}`;
    pv.innerHTML = PREVIEW.map(c => `<div class="card up">${CardFaces.html(c, settings.face)}</div>`).join('') +
                   '<div class="card"></div><div class="card"></div>';
  }
  function refreshSettings() {
    refreshPreview();
    document.querySelectorAll('.seg').forEach(seg => {
      const v = String(settings[seg.dataset.key]);
      seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    });
  }

  document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const key = seg.dataset.key, v = b.dataset.v;
    if (key === 'lang') {
      // Byt språk: spara, ladda om sidan och öppna inställningarna igen
      if (v === I18N.lang) return;
      store.set(SKEY, Object.assign(store.get(SKEY) || {}, { lang: v }));
      try { sessionStorage.setItem('reopen', 'settings'); } catch (err) {}
      location.reload();
      return;
    }
    settings[key] = key === 'effects' || key === 'hints' || key === 'sound' ? v === 'true' : key === 'undo' ? +v : v;
    store.set(SKEY, Object.assign(store.get(SKEY) || {}, settings));
    refreshSettings(); applyEffects();
  }));

  // Knappar som raderar något kräver två tryck
  function twoStep(id, action, doneKey) {
    const b = $(id), label = b.textContent;
    let timer = 0;
    b.onclick = () => {
      if (!b.classList.contains('armed')) {
        b.classList.add('armed'); b.textContent = t('confirmTap');
        timer = setTimeout(() => { b.classList.remove('armed'); b.textContent = label; }, 3000);
        return;
      }
      clearTimeout(timer);
      action();
      b.classList.remove('armed'); b.textContent = t(doneKey);
      setTimeout(() => b.textContent = label, 2500);
    };
  }
  twoStep('reset-stats', () => GAMES.forEach(g => store.del(g.statsKey)), 'resetStatsDone');
  twoStep('reset-games', () => GAMES.forEach(g => store.del(g.gameKey)), 'resetGamesDone');
  $('open-settings').onclick = () => { refreshSettings(); $('settings').classList.add('open'); };
  $('close').onclick = () => $('settings').classList.remove('open');
  $('settings').onclick = e => { if (e.target.id === 'settings') $('settings').classList.remove('open'); };
  $('open-stats').onclick = () => { $('stats').classList.add('open'); fitStats(); };
  $('stats-close').onclick = () => $('stats').classList.remove('open');
  $('stats').onclick = e => { if (e.target.id === 'stats') $('stats').classList.remove('open'); };
  $('play').onclick = () => { document.body.classList.add('leaving'); setTimeout(() => location.href = 'games.html', 220); };
  window.addEventListener('pageshow', () => document.body.classList.remove('leaving'));

  try { if (sessionStorage.getItem('reopen') === 'settings') { sessionStorage.removeItem('reopen'); $('open-settings').click(); } } catch (err) {}

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
